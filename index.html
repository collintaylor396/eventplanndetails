      var navigationScript = '<script>(function(){var origin=' + JSON.stringify(pageOrigin) + ';var originalUrl=' + JSON.stringify(pageUrl) + ';var originalHash=' + JSON.stringify(pageHash) + ';if(origin)window.__sxDocumentOrigin=origin;if(originalUrl)window.__sxOriginalUrl=originalUrl;if(originalHash)window.__sxOriginalHash=originalHash;try{if(originalUrl)sessionStorage.setItem("sx.originalUrl",originalUrl);if(originalHash)sessionStorage.setItem("sx.originalHash",originalHash);}catch(e){}window.__sxTopNavigate=function(url){if(!url)return;try{var base=window.__sxDocumentOrigin||window.location.href;var target=new URL(String(url),base);if((target.protocol==="http:"||target.protocol==="https:")&&window.top&&window.top!==window.self){try{window.top.location.replace(target.href);return;}catch(e){}}window.location.replace(target.href);}catch(e){window.location.href=url;}};})();<\/script>';
      if (/<head[^>]*>/i.test(html)) {
        return html.replace(/<head([^>]*)>/i, '$&' + navigationScript);
      }
      return navigationScript + html;
    }

    function renderHtml(html) {
      if (USE_BLOB && window.URL && URL.createObjectURL && window.Blob) {
        try {
          var blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
          window.location.href = blobUrl;
          setTimeout(function(){
            if (window.location.href !== blobUrl) {
              document.open();
              document.write(html);
              document.close();
            }
          }, 600);
          return;
        } catch (e) {}
      }

      document.open();
      document.write(html);
      document.close();
    }

    var keyBytes = b64ToBytes(payload.key);
    var iv = b64ToBytes(payload.iv);
    var cipherBytes = b64ToBytes(payload.cipher);

    var k = await crypto.subtle.importKey(
      "raw",
      keyBytes,
      "AES-GCM",
      false,
      ["decrypt"]
    );

    var p = await crypto.subtle.decrypt({name:"AES-GCM", iv: iv}, k, cipherBytes);
    var html = prepareHtml(new TextDecoder().decode(p));

    renderHtml(html);
  } catch (e) {
    document.body.innerHTML = "Loading failed: " + e.message;
  }
})();
